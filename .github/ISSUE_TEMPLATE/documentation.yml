name: Documentation
description: Report a documentation issue or suggest improvements
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve our documentation! Please provide details about the documentation issue or improvement.
  
  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What type of documentation issue is this?
      options:
        - Incorrect or outdated information
        - Missing documentation
        - Unclear or confusing content
        - Typo or grammar issue
        - Code example issue
        - Other
    validations:
      required: true
  
  - type: input
    id: location
    attributes:
      label: Location
      description: Where is the documentation issue located?
      placeholder: URL, file path, or section name
    validations:
      required: true
  
  - type: textarea
    id: current
    attributes:
      label: Current Documentation
      description: What does the current documentation say? (if applicable)
      placeholder: Quote the current text or describe what exists now
    validations:
      required: false
  
  - type: textarea
    id: suggested
    attributes:
      label: Suggested Improvement
      description: What should the documentation say instead, or what should be added?
      placeholder: Provide your suggested changes or additions
    validations:
      required: true
  
  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning
      description: Why is this change or addition needed?
      placeholder: Explain why this would improve the documentation
    validations:
      required: false
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples
      placeholder: Any additional information that would help
    validations:
      required: false
